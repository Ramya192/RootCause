<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="With a hidden confounder the pipeline's estimate of pay's effect drifts from -0.114 to -0.214 while the true effect stays near -0.11."><style>
svg{color:#17181a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bx{fill:#fff;stroke:#e3e5e8;stroke-width:1.4}
.bx.hi{stroke:#2a78d6;stroke-width:2;fill:#e8f0fb}
.bx.dsh{stroke-dasharray:5 4}
.bx.out{fill:none;stroke-dasharray:6 5}
.ln{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.75}
.ln.dsh{stroke-dasharray:5 4}
.ln.acc{stroke:#2a78d6;opacity:1;stroke-width:2}
.t{font:600 13px system-ui,sans-serif;fill:currentColor}
.pt{font:12px system-ui,sans-serif;fill:currentColor}
.s,.lbl,.ax{font:11px system-ui,sans-serif;fill:#5f6368}
.cap{font:600 10.5px system-ui,sans-serif;fill:#5f6368;letter-spacing:.06em}
.num{fill:#2a78d6}
.numt{font:700 12px system-ui,sans-serif;fill:#fff}
.grid{stroke:#e3e5e8;stroke-width:1}
.l-truth{fill:none;stroke:#2a78d6;stroke-width:2.5}
.l-est{fill:none;stroke:#eb6834;stroke-width:2.5}
.c-truth{fill:#2a78d6;stroke:#f7f8fa;stroke-width:2}
.c-est{fill:#eb6834;stroke:#f7f8fa;stroke-width:2}
.lab-truth,.lab-est{font:600 12px system-ui,sans-serif;fill:#17181a}
.gap{stroke:#5f6368;stroke-width:1.2;stroke-dasharray:3 3}
</style><rect width="760" height="310" fill="#ffffff"/>
