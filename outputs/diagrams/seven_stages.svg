      <rect class="bx dsh" x="10" y="8" width="1040" height="30" rx="8"/>
      <text class="pt" x="530" y="28" text-anchor="middle">Domain YAML: variables · priors · levers · costs · sensitive attribute</text>
      <path class="ln" d="M76 38 V62" marker-end="url(#a2)"/><rect class="bx" x="10" y="64" width="132" height="148" rx="8"/><circle class="num" cx="76" cy="82" r="12"/><text class="numt" x="76" y="86" text-anchor="middle">1</text><text class="t" x="76" y="114" text-anchor="middle">Ingestion</text><text class="s" x="76" y="132" text-anchor="middle">pandas</text><line class="grid" x1="20" x2="132" y1="144" y2="144"/><text class="cap" x="76" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="76" y="177" text-anchor="middle">clean table,</text><text class="pt" x="76" y="193" text-anchor="middle">0/1 outcome</text><rect class="bx dsh" x="10" y="226" width="132" height="76" rx="8"/><text class="cap" x="76" y="244" text-anchor="middle">GUARD</text><text class="pt" x="76" y="263" text-anchor="middle">rejects an outcome</text><text class="pt" x="76" y="279" text-anchor="middle">that is not 0/1</text><path class="ln" d="M142 138 H161" marker-end="url(#a2)"/><path class="ln dsh" d="M76 212 V224"/><path class="ln" d="M227 38 V62" marker-end="url(#a2)"/><rect class="bx" x="161" y="64" width="132" height="148" rx="8"/><circle class="num" cx="227" cy="82" r="12"/><text class="numt" x="227" y="86" text-anchor="middle">2</text><text class="t" x="227" y="114" text-anchor="middle">Feature store</text><text class="s" x="227" y="132" text-anchor="middle">Feast</text><line class="grid" x1="171" x2="283" y1="144" y2="144"/><text class="cap" x="227" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="227" y="177" text-anchor="middle">numeric feature</text><text class="pt" x="227" y="193" text-anchor="middle">vectors</text><rect class="bx dsh" x="161" y="226" width="132" height="76" rx="8"/><text class="cap" x="227" y="244" text-anchor="middle">GUARD</text><text class="pt" x="227" y="263" text-anchor="middle">missing values</text><text class="pt" x="227" y="279" text-anchor="middle">fail loudly</text><path class="ln" d="M293 138 H312" marker-end="url(#a2)"/><path class="ln dsh" d="M227 212 V224"/><path class="ln" d="M378 38 V62" marker-end="url(#a2)"/><rect class="bx" x="312" y="64" width="132" height="148" rx="8"/><circle class="num" cx="378" cy="82" r="12"/><text class="numt" x="378" y="86" text-anchor="middle">3</text><text class="t" x="378" y="114" text-anchor="middle">Causal discovery</text><text class="s" x="378" y="132" text-anchor="middle">causal-learn, lingam</text><line class="grid" x1="322" x2="434" y1="144" y2="144"/><text class="cap" x="378" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="378" y="177" text-anchor="middle">directed graph</text><text class="pt" x="378" y="193" text-anchor="middle">(PC, GES, LiNGAM)</text><rect class="bx dsh" x="312" y="226" width="132" height="76" rx="8"/><text class="cap" x="378" y="244" text-anchor="middle">GUARD</text><text class="pt" x="378" y="263" text-anchor="middle">required / forbidden</text><text class="pt" x="378" y="279" text-anchor="middle">edges from config</text><path class="ln" d="M444 138 H463" marker-end="url(#a2)"/><path class="ln dsh" d="M378 212 V224"/><path class="ln" d="M529 38 V62" marker-end="url(#a2)"/><rect class="bx hi" x="463" y="64" width="132" height="148" rx="8"/><circle class="num" cx="529" cy="82" r="12"/><text class="numt" x="529" y="86" text-anchor="middle">4</text><text class="t" x="529" y="114" text-anchor="middle">Effect estimation</text><text class="s" x="529" y="132" text-anchor="middle">DoWhy, statsmodels</text><line class="grid" x1="473" x2="585" y1="144" y2="144"/><text class="cap" x="529" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="529" y="177" text-anchor="middle">effect per lever</text><text class="pt" x="529" y="193" text-anchor="middle">(ATE)</text><rect class="bx dsh" x="463" y="226" width="132" height="76" rx="8"/><text class="cap" x="529" y="244" text-anchor="middle">GUARD</text><text class="pt" x="529" y="263" text-anchor="middle">placebo test and</text><text class="pt" x="529" y="279" text-anchor="middle">sensitivity analysis</text><path class="ln" d="M595 138 H614" marker-end="url(#a2)"/><path class="ln dsh" d="M529 212 V224"/><path class="ln" d="M680 38 V62" marker-end="url(#a2)"/><rect class="bx" x="614" y="64" width="132" height="148" rx="8"/><circle class="num" cx="680" cy="82" r="12"/><text class="numt" x="680" y="86" text-anchor="middle">5</text><text class="t" x="680" y="114" text-anchor="middle">Counterfactuals</text><text class="s" x="680" y="132" text-anchor="middle">CausalML learners</text><line class="grid" x1="624" x2="736" y1="144" y2="144"/><text class="cap" x="680" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="680" y="177" text-anchor="middle">what-if effect,</text><text class="pt" x="680" y="193" text-anchor="middle">by subgroup</text><rect class="bx dsh" x="614" y="226" width="132" height="76" rx="8"/><text class="cap" x="680" y="244" text-anchor="middle">GUARD</text><text class="pt" x="680" y="263" text-anchor="middle">propensity overlap</text><text class="pt" x="680" y="279" text-anchor="middle">warning</text><path class="ln" d="M746 138 H765" marker-end="url(#a2)"/><path class="ln dsh" d="M680 212 V224"/><path class="ln" d="M831 38 V62" marker-end="url(#a2)"/><rect class="bx" x="765" y="64" width="132" height="148" rx="8"/><circle class="num" cx="831" cy="82" r="12"/><text class="numt" x="831" y="86" text-anchor="middle">6</text><text class="t" x="831" y="114" text-anchor="middle">Interventions</text><text class="s" x="831" y="132" text-anchor="middle">fairlearn</text><line class="grid" x1="775" x2="887" y1="144" y2="144"/><text class="cap" x="831" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="831" y="177" text-anchor="middle">actions ranked</text><text class="pt" x="831" y="193" text-anchor="middle">by ROI</text><rect class="bx dsh" x="765" y="226" width="132" height="76" rx="8"/><text class="cap" x="831" y="244" text-anchor="middle">GUARD</text><text class="pt" x="831" y="263" text-anchor="middle">four-fifths</text><text class="pt" x="831" y="279" text-anchor="middle">fairness flag</text><path class="ln" d="M897 138 H916" marker-end="url(#a2)"/><path class="ln dsh" d="M831 212 V224"/><path class="ln" d="M982 38 V62" marker-end="url(#a2)"/><rect class="bx" x="916" y="64" width="132" height="148" rx="8"/><circle class="num" cx="982" cy="82" r="12"/><text class="numt" x="982" y="86" text-anchor="middle">7</text><text class="t" x="982" y="114" text-anchor="middle">Explanation</text><text class="s" x="982" y="132" text-anchor="middle">SHAP, AutoGen, OpenAI</text><line class="grid" x1="926" x2="1038" y1="144" y2="144"/><text class="cap" x="982" y="160" text-anchor="middle">PRODUCES</text><text class="pt" x="982" y="177" text-anchor="middle">plain-language</text><text class="pt" x="982" y="193" text-anchor="middle">narrative + SHAP</text><rect class="bx dsh" x="916" y="226" width="132" height="76" rx="8"/><text class="cap" x="982" y="244" text-anchor="middle">GUARD</text><text class="pt" x="982" y="263" text-anchor="middle">every number must</text><text class="pt" x="982" y="279" text-anchor="middle">match the facts</text><path class="ln dsh" d="M982 212 V224"/>
